<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DeepSeek 本地模型启动器</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Microsoft YaHei UI", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 700px at 20% -10%, #1b2a5e 0%, #070b16 55%),
                radial-gradient(900px 600px at 100% 100%, #2a1b5e 0%, transparent 60%), #070b16;
    color: #eaf0ff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .wrap { width: min(560px, 84vw); text-align: center; }
  .logo {
    width: 96px; height: 96px; margin: 0 auto 26px; border-radius: 26px;
    background: linear-gradient(160deg, #4d6bfe, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 18px 50px rgba(77, 107, 254, 0.35);
    animation: float 3.2s ease-in-out infinite;
  }
  .logo svg { width: 52px; height: 52px; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  h1 { font-size: 24px; font-weight: 700; margin: 0 0 10px; letter-spacing: 0.5px; }
  .sub { font-size: 13px; color: #8f9dbf; margin-bottom: 34px; }
  .bar {
    height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08);
    overflow: hidden; margin-bottom: 14px;
  }
  .bar i {
    display: block; height: 100%; width: 8%; border-radius: 999px;
    background: linear-gradient(90deg, #4d6bfe, #8f7bff);
    transition: width 0.35s ease;
  }
  .status { display: flex; justify-content: space-between; font-size: 13px; color: #9fb0d4; }
  .pct { font-variant-numeric: tabular-nums; color: #c9d6ff; }
  .tip { margin-top: 40px; font-size: 12px; color: #5f6d8f; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3a9 9 0 1 0 9 9c0-1.2-.2-2.3-.7-3.3"/>
        <path d="M21 3l-9 9"/>
        <path d="M15.5 3H21v5.5"/>
      </svg>
    </div>
    <h1>DeepSeek 本地模型启动器</h1>
    <div class="sub">本地运行 · 数据不出电脑</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="status"><span id="status">正在启动…</span><span class="pct" id="pct">0%</span></div>
    <div class="tip">首次启动需要加载运行时与模型，请稍候</div>
  </div>
  <script>
    function setSplash(pct, text) {
      pct = Math.max(0, Math.min(100, Number(pct) || 0));
      document.getElementById('bar').style.width = pct + '%';
      document.getElementById('pct').textContent = pct + '%';
      if (text) document.getElementById('status').textContent = text;
    }
    window.setSplash = setSplash;
    setSplash(6, '正在初始化…');
  </script>
</body>
</html>
